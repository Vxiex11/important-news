<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Comunicado ficticio y satírico. No es una alerta real.">
  <meta name="robots" content="noindex">
  <title>Important News</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; }
    main { width: min(680px, calc(100% - 40px)); padding: 32px; border: 1px solid #374151; border-radius: 20px; background: #1f2937; box-shadow: 0 20px 60px #0006; }
    .badge { display: inline-block; padding: 8px 12px; border-radius: 999px; background: #fbbf24; color: #111827; font-weight: 800; letter-spacing: .04em; font-size: .82rem; }
    h1 { margin: 22px 0 12px; font-size: clamp(2rem, 6vw, 4rem); line-height: 1.05; }
    .notice { padding: 18px; border-left: 4px solid #fbbf24; background: #111827; font-size: 1.15rem; }
    p { color: #d1d5db; line-height: 1.6; }
    code { color: #fde68a; }
    footer { margin-top: 28px; font-size: .9rem; color: #9ca3af; }
  </style>
</head>
<body>
  <main>
    <span class="badge"></span>
    <h1>La Tierra se va a acabar en 1 día!!!</h1>
    <div class="notice"> Pasa tiempo con tu familia y seres queridos —existE una emergencia real.</div>
  </main>
</body>
</html>
